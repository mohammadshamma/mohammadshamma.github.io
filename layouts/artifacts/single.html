{{- define "main" -}}
<div class="artifact-shell">
    <nav class="breadcrumb artifact-back" aria-label="Breadcrumb">
        <a href="{{ .CurrentSection.RelPermalink }}">&larr; All {{ .CurrentSection.Title }}</a>
    </nav>
    {{- $slug := strings.TrimPrefix "/" .RelPermalink | strings.TrimSuffix "/" -}}
    {{- with resources.Get (printf "%s/index.html" $slug) -}}
    {{- $embed := . | resources.Copy (printf "%s/embed.html" $slug) -}}
    <iframe
        id="artifact-frame"
        class="artifact-frame"
        src="{{ $embed.RelPermalink }}"
        title="{{ $.Title }}"
        scrolling="no"
    ></iframe>
    {{- end -}}
</div>
<script>
(() => {
    const frame = document.getElementById("artifact-frame");
    if (!frame) return;

    const syncThemeToFrame = () => {
        try {
            const doc = frame.contentDocument;
            if (!doc || !doc.documentElement) return;
            const isDark = document.documentElement.classList.contains("dark") ||
                (!document.documentElement.classList.contains("light") &&
                 window.matchMedia("(prefers-color-scheme: dark)").matches);
            doc.documentElement.classList.toggle("dark", isDark);
            doc.documentElement.classList.toggle("light", !isDark);
            if (frame.contentWindow && typeof frame.contentWindow.__applyHostTheme === "function") {
                frame.contentWindow.__applyHostTheme(isDark);
            }
        } catch (_) {}
    };

    let isMaximized = false;

    const setOutsideInert = (inert) => {
        Array.from(document.body.children).forEach((el) => {
            if (!el.contains(frame) && el.tagName !== "SCRIPT") {
                el.inert = inert;
            }
        });
        const backNav = frame.parentElement && frame.parentElement.querySelector(".artifact-back");
        if (backNav) backNav.inert = inert;
    };

    const syncHeight = () => {
        try {
            if (isMaximized) {
                const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
                frame.style.minHeight = "0px";
                frame.style.height = Math.ceil(vh) + "px";
                return;
            }
            const doc = frame.contentDocument;
            if (!doc || !doc.body) return;
            const h = Math.ceil(doc.body.getBoundingClientRect().height) || doc.body.scrollHeight;
            if (h > 0) {
                frame.style.minHeight = "0px";
                frame.style.height = h + "px";
            }
        } catch (_) {}
    };

    const syncViewportToFrame = () => {
        try {
            if (!frame.contentWindow || typeof frame.contentWindow.__applyHostViewport !== "function") return;
            const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
            const vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
            if (isMaximized) {
                frame.contentWindow.__applyHostViewport(Math.max(240, Math.floor(vh)));
                syncHeight();
                return;
            }
            const isShortLandscape = vh <= 520 && vw > vh;
            const top = Math.max(0, frame.getBoundingClientRect().top + window.scrollY);
            const targetH = isShortLandscape
                ? Math.max(240, Math.floor(vh))
                : Math.max(320, Math.floor(vh - top - 16));
            frame.contentWindow.__applyHostViewport(targetH);
            syncHeight();
        } catch (_) {}
    };

    const setMaximized = (next) => {
        const target = Boolean(next);
        if (target === isMaximized) return isMaximized;
        isMaximized = target;
        frame.classList.toggle("is-maximized", isMaximized);
        document.documentElement.classList.toggle("has-maximized-artifact", isMaximized);
        setOutsideInert(isMaximized);
        syncViewportToFrame();
        try {
            if (frame.contentWindow && typeof frame.contentWindow.__onHostMaximizedChange === "function") {
                frame.contentWindow.__onHostMaximizedChange(isMaximized);
            }
        } catch (_) {}
        return isMaximized;
    };

    window.__setArtifactMaximized = setMaximized;
    window.__isArtifactMaximized = () => isMaximized;

    window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && isMaximized) {
            setMaximized(false);
        }
    });

    frame.addEventListener("load", () => {
        syncThemeToFrame();
        syncViewportToFrame();
        syncHeight();
        try {
            const doc = frame.contentDocument;
            if (doc && doc.body && "ResizeObserver" in window) {
                new ResizeObserver(syncHeight).observe(doc.body);
            }
            if (doc) {
                doc.querySelectorAll("a[href]").forEach((a) => {
                    if (!a.getAttribute("target")) a.setAttribute("target", "_top");
                });
            }
        } catch (_) {}
    });

    window.addEventListener("resize", syncViewportToFrame, { passive: true });
    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncViewportToFrame, { passive: true });
    }

    new MutationObserver(syncThemeToFrame).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["class"],
    });
})();
</script>
{{- end -}}
