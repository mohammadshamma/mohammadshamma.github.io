<html lang="en" class="scroll-smooth">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    <style>
      /* Standalone: the body is the scroll container sized to the viewport. */
      html { block-size: 100vh; block-size: 100dvh; overflow: hidden; background: #FAF8F5; }
      body { block-size: 100vh; block-size: 100dvh; margin: 0; overflow-y: auto; overscroll-behavior: contain; }
      /* Framed in the blog: bind to the height the host computes (layouts/artifacts/single.html). */
      html.is-embedded, html.is-embedded body { block-size: var(--embed-height, 680px); }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        function applyEmbeddedHeight(px) {
          var h = Math.max(240, Math.min(2000, Math.floor(px)));
          root.style.setProperty("--embed-height", h + "px");
        }
        window.__applyHostViewport = applyEmbeddedHeight;
        window.__applyHostTheme = function () {}; // light-only page
        if (window.self !== window.top) {
          root.classList.add("is-embedded");
          try {
            var pw = window.parent, fe = window.frameElement;
            if (pw && fe) {
              var vh = (pw.visualViewport && pw.visualViewport.height) || pw.innerHeight;
              var top = fe.getBoundingClientRect().top + pw.scrollY;
              applyEmbeddedHeight(Math.max(320, vh - top - 16));
            }
          } catch (_) {}
        }
        // In-page anchors scroll the body; the host sets target=_top on links, so handle them here.
        document.addEventListener("click", function (e) {
          var a = e.target.closest && e.target.closest('a[href^="#"]');
          if (!a) return;
          e.preventDefault();
          var id = a.getAttribute("href").slice(1);
          var el = id && document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          else document.body.scrollTo({ top: 0, behavior: "smooth" });
        }, true);
      })();
    </script>
